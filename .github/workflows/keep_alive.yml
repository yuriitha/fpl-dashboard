name: Keep Streamlit App Alive

on:
  schedule:
    # Запуск двічі на добу (кожні 12 годин: о 00:00 та 12:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Дозволяє запустити вручну через вкладку Actions

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit Dashboard
        run: |
          APP_URL="https://yuriith-fantasy.streamlit.app"
          
          echo "Pinging $APP_URL..."
          STATUS_CODE=$(curl -s -L \
            -c /tmp/cookies.txt \
            -b /tmp/cookies.txt \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -o /dev/null \
            -w "%{http_code}" \
            "$APP_URL")
            
          echo "HTTP Response code: $STATUS_CODE"
          
          if [ "$STATUS_CODE" -eq 200 ] || [ "$STATUS_CODE" -eq 304 ]; then
            echo "Success: App is awake and responding!"
          else
            echo "Warning: Response code was $STATUS_CODE"
            exit 1
          fi
